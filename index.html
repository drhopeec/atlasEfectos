<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas de Efectos Psicodélicos</title>
  
  <link rel="stylesheet" href="estilos.css">
  
  <script src="efectos.js"></script>
  <script src="referencias.js"></script>
</head>
<body>

  <main id="atlas-container"></main>

  <script>
    
    // --- SECCIÓN 1: DATOS Y TEXTOS NARRATIVOS ---

    const ordenDominios = ["visual", "cognitivo", "emocional", "autoprocesamiento", "somatico"];

    const textoIntroduccion = `
      <p>Este atlas está hecho para <strong>darle nombre a lo que aparece en sesión</strong> y ofrecer <strong>criterios concretos</strong> para acompañar con más claridad.</p>

      <p>Durante una experiencia psicodélica pueden aparecer fenómenos visuales, cognitivos, emocionales, somáticos y de autoprocesamiento. Algunos son esperables y no requieren intervención. Otros piden anclaje, reencuadre o escalamiento.</p>

      <p>El objetivo de este documento es simple: ayudarte a reconocer qué está ocurriendo, qué puede observarse desde fuera, qué nivel de riesgo tiene y qué respuesta conviene aplicar.</p>

      <p>Este atlas no intenta explicar todos los mecanismos neurobiológicos. Ese tema corresponde al folleto de mecanismos. Aquí el foco es operativo: <strong>fenomenología, riesgo, intervención e integración</strong>.</p>
    `;

    const textoComoUsar = `
      <p>Este documento está diseñado para consulta rápida y estudio. No necesita leerse de corrido. Puedes revisar el dominio que corresponda y entrar directamente a la ficha del efecto.</p>

      <p>Cada <strong>efecto</strong> se presenta en cuatro bloques:</p>

      <ul>
        <li><strong>Fenomenología:</strong> lo que la persona puede reportar y lo que el facilitador puede observar.</li>
        <li><strong>Lectura operativa:</strong> una frase de normalización y los moduladores que pueden aumentar o reducir el riesgo.</li>
        <li><strong>Riesgo e intervención:</strong> nivel de riesgo, indicadores post-sesión y criterios para escalar.</li>
        <li><strong>Integración post-sesión:</strong> tema a explorar y práctica sugerida para traducir la experiencia en lenguaje y acción.</li>
      </ul>

      <p><strong>Uso recomendado:</strong> antes de la sesión, revisa los efectos más probables. Durante la sesión, usa la ficha para decidir si conviene sostener, anclar, reencuadrar o escalar. Después, usa la integración para ordenar lo vivido sin forzar interpretaciones.</p>

      <p>La regla base es esta: <strong>un fenómeno subjetivo no se evalúa por lo extraño que parece, sino por su impacto en orientación, regulación, juicio de realidad y seguridad.</strong></p>
    `;

    const textosDominio = {
      "visual": "Lo que la persona <strong>ve</strong>. Desde formas geométricas hasta figuras, estelas o superficies que parecen moverse. La tarea no es interpretar de inmediato, sino distinguir entre percepción esperable, sobrecarga y riesgo.",
      "cognitivo": "Lo que la persona <strong>piensa</strong>. Ideas rápidas, bucles mentales, intuiciones súbitas o cambios en la percepción del tiempo. El reto es no discutir el contenido, sino observar regulación, coherencia y contacto.",
      "emocional": "Lo que la persona <strong>siente</strong>. Miedo, culpa, tristeza, dicha, alivio o catarsis. La intensidad emocional no es un problema por sí misma; el problema aparece cuando rebasa la capacidad de regulación.",
      "autoprocesamiento": "Lo que la persona <strong>revisa sobre sí misma</strong>. Identidad, autocrítica, aceptación, memoria autobiográfica o sentido personal. Aquí se acompaña sin imponer significado.",
      "somatico": "Lo que la persona <strong>manifiesta en el cuerpo</strong>. Náuseas, calor, temblores, presión, palpitaciones o cambios de respiración. Aquí se diferencia entre descarga esperable, ansiedad somática y señal médica relevante."
    };

    const glosarioData = [
      {
        "termino": "Anclaje",
        "definicion": "Intervención mínima para reconectar a la persona con el cuerpo o el entorno mediante frases breves, respiración, contacto con superficies o estímulos sensoriales simples."
      },
      {
        "termino": "Apertura a la experiencia",
        "definicion": "Disposición a explorar sensaciones, emociones o ideas nuevas sin cerrarse de inmediato. Puede facilitar el proceso, pero no sustituye estabilidad ni preparación."
      },
      {
        "termino": "Autoesquema",
        "definicion": "Conjunto de creencias sobre uno mismo. Durante una experiencia psicodélica puede volverse más flexible, visible o emocionalmente cargado."
      },
      {
        "termino": "Avance emocional",
        "definicion": "Momento en el que la persona atraviesa una emoción difícil sin evitarla y logra una forma nueva de contacto, aceptación o comprensión."
      },
      {
        "termino": "Bypass espiritual",
        "definicion": "Uso de lenguaje espiritual para evitar dolor, conflicto, responsabilidad o trabajo psicológico real."
      },
      {
        "termino": "Contención silenciosa",
        "definicion": "Presencia activa, estable y tranquila del facilitador sin intervención verbal innecesaria. Sirve cuando la experiencia se está desarrollando sin riesgo."
      },
      {
        "termino": "Criterios de escalamiento",
        "definicion": "Señales observables que indican que ya no basta con sostener o anclar. Pueden incluir riesgo físico, agitación severa, pérdida marcada de contacto, pánico persistente o ideación suicida."
      },
      {
        "termino": "Cualidad noética",
        "definicion": "Sensación subjetiva de certeza profunda. Puede generar insight valioso, pero también conclusiones rígidas si no se integra con cuidado."
      },
      {
        "termino": "Factores de riesgo",
        "definicion": "Variables que pueden aumentar la intensidad o dificultad de un efecto. Incluyen dosis, historia personal, estado emocional, entorno, preparación y apoyo."
      },
      {
        "termino": "Flexibilidad psicológica",
        "definicion": "Capacidad de estar en contacto con experiencias internas difíciles sin reaccionar de forma automática o evitativa."
      },
      {
        "termino": "Frase de normalización",
        "definicion": "Enunciado breve que valida la experiencia y reduce la percepción de peligro sin imponer una interpretación."
      },
      {
        "termino": "Indicadores post-sesión",
        "definicion": "Señales que aparecen después de la sesión y pueden requerir seguimiento: ansiedad persistente, confusión, insomnio, desrealización, retraimiento o creencias rígidas."
      },
      {
        "termino": "Insight psicológico",
        "definicion": "Comprensión significativa sobre un patrón emocional, relacional o conductual. No toda comprensión intensa debe tomarse como conclusión definitiva."
      },
      {
        "termino": "Integración",
        "definicion": "Proceso de traducir lo vivido en lenguaje, decisiones, prácticas y cambios sostenibles. No es explicar todo; es ordenar lo importante."
      },
      {
        "termino": "Manual de intervención",
        "definicion": "Secuencia gradual de respuesta: sostén, anclaje, reencuadre y escalamiento. Se aplica según intensidad, riesgo y respuesta observable."
      },
      {
        "termino": "Matriz de riesgo",
        "definicion": "Clasificación orientativa que estima si un fenómeno requiere solo observación, intervención mínima, reencuadre activo o escalamiento."
      },
      {
        "termino": "Reencuadre",
        "definicion": "Intervención verbal breve que ayuda a reinterpretar una experiencia difícil sin discutir ni imponer significado."
      },
      {
        "termino": "Sostén",
        "definicion": "Presencia sin acción directiva. Se usa cuando la experiencia es intensa pero la persona conserva orientación, regulación suficiente y seguridad."
      },
      {
        "termino": "Shock ontológico",
        "definicion": "Desorganización o confusión cuando la experiencia desafía de forma intensa las creencias básicas sobre la realidad, la identidad o el sentido."
      }
    ];

    // --- SECCIÓN 2: FUNCIONES DE AYUDA PARA RENDERIZAR ---

    function slugify(text) {
      return text.toString().toLowerCase().trim()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-');
    }

    function mapearLista(items) {
      if (!items || items.length === 0) return '<p>NA</p>';
      const itemsFiltrados = items.filter(item => item && item !== "NA");
      if (itemsFiltrados.length === 0) return '<p>NA</p>';
      return `<ul>${itemsFiltrados.map(item => `<li>${item}</li>`).join('')}</ul>`;
    }

    function obtenerIndicadoresPostSesion(efecto) {
      if (efecto.banderas_rojas_diagnostico_diferencial && efecto.banderas_rojas_diagnostico_diferencial.length > 0) {
        return efecto.banderas_rojas_diagnostico_diferencial;
      }

      if (efecto.indicadores_postsesion && efecto.indicadores_postsesion.length > 0) {
        return efecto.indicadores_postsesion;
      }

      return ["NA"];
    }

    function obtenerJustificacionRiesgo(matrizRiesgo) {
      if (!matrizRiesgo) return "No especificado.";

      const match = matrizRiesgo.match(/\(Justificación:\s*(.*?)\)$/);
      if (match && match[1]) return match[1];

      return matrizRiesgo;
    }

    function obtenerNivelRiesgo(matrizRiesgo) {
      if (!matrizRiesgo) return "No especificado";
      return matrizRiesgo.split(' ')[0].replace(/[()]/g, '');
    }

    function generarSeccion(texto, titulo, id = '') {
      const idAttr = id ? ` id="${id}"` : '';
      return `
        <div class="pagina-a4 section-a4"${idAttr}>
          <h1>${titulo}</h1>
          ${texto}
        </div>
      `;
    }

    function generarHtmlReferencias(dominios = []) {
      if (typeof referenciasData === 'undefined') return ''; 

      const referenciasUnicas = new Set();
      
      for (const dominio of dominios) {
        if (referenciasData[dominio]) {
          referenciasData[dominio].forEach(ref => {
            referenciasUnicas.add(JSON.stringify(ref));
          });
        }
      }

      const referencias = Array.from(referenciasUnicas).map(refStr => JSON.parse(refStr));
      if (referencias.length === 0) return ''; 

      const listaHtml = referencias.map(ref => `
        <li>
          <strong>${ref.referencia}</strong>
          ${ref.resumen_atlas ? ref.resumen_atlas : ''}
        </li>
      `).join('');

      const dominioId = 'referencias-' + slugify(dominios[0]);

      return `
        <div class="pagina-a4 referencias-pagina" id="${dominioId}">
          <h1 style="text-transform: capitalize;">Referencias: Dominio ${dominios[0]}</h1>
          <ul class="lista-referencias">
            ${listaHtml}
          </ul>
        </div>
      `;
    }

    function generarHtmlFicha(efecto) {
      const fichaId = 'efecto-' + slugify(efecto.efecto);
      const indicadoresPostSesion = obtenerIndicadoresPostSesion(efecto);
      const nivelRiesgo = obtenerNivelRiesgo(efecto.matriz_riesgo);
      const justificacionRiesgo = obtenerJustificacionRiesgo(efecto.matriz_riesgo);

      return `
        <div class="pagina-a4 ficha-a4" id="${fichaId}">
          <header class="ficha-header">
            <h1>${efecto.efecto}</h1>
            <h2>${efecto.dominio.join(' / ')}</h2>
          </header>
          
          <div class="ficha-grid">
            
            <div class="grid-col">
              <h3>Fenomenología</h3>

              <h4>Reporte subjetivo</h4>
              <p>${efecto.fenomenologia.descripcion_paciente}</p>

              <h4>Signos observables</h4>
              <p>${efecto.fenomenologia.signos_observables}</p>
            </div>
            
            <div class="grid-col">
              <h3>Lectura operativa</h3>

              <h4>Normalización</h4>
              <p><em>"${efecto.neurobiologia_aplicada.frase_de_normalizacion}"</em></p>

              <h4>Moduladores de riesgo</h4>
              ${mapearLista([
                efecto.moduladores_riesgo.dosis ? `<strong>Dosis:</strong> ${efecto.moduladores_riesgo.dosis}` : null,
                efecto.moduladores_riesgo.historial ? `<strong>Historial:</strong> ${efecto.moduladores_riesgo.historial.join(', ')}` : null,
                efecto.moduladores_riesgo.medicacion ? `<strong>Medicación:</strong> ${efecto.moduladores_riesgo.medicacion.join(', ')}` : null,
                efecto.moduladores_riesgo.set_setting ? `<strong>Set & Setting:</strong> ${efecto.moduladores_riesgo.set_setting.join(', ')}` : null
              ])}

              <p class="micro-etiqueta">
                <strong>* La frase de normalización no interpreta la experiencia. Solo reduce amenaza y sostiene orientación.</strong>
              </p>
            </div>
            
            <div class="grid-col">
              <h3>Riesgo y Escalamiento</h3>

              <div class="matriz-riesgo-box">
                <h4 class="riesgo-titulo">Nivel de Riesgo: <span>${nivelRiesgo}</span></h4>
                <p>${justificacionRiesgo}</p>
                <p class="micro-etiqueta"><strong>* Usa intervención gradual por niveles.</strong></p>
              </div>

              <h4>Indicadores post-sesión</h4>
              ${mapearLista(indicadoresPostSesion)}

              ${
                indicadoresPostSesion &&
                indicadoresPostSesion[0] !== "NA"
                  ? `<p class="micro-etiqueta"><strong>* Si aparece o persiste alguno de estos indicadores, considera seguimiento clínico.</strong></p>`
                  : `<p class="micro-etiqueta">* No se identificaron indicadores post-sesión relevantes para este efecto.</p>`
              }
            </div>
            
            <div class="ficha-manual">
              <h3>Manual de Intervención</h3>

              <div class="bloque-icono">
                <div class="icono">✦</div>
                <div>
                  <h4>Sostén</h4>
                  <p class="micro-etiqueta">Cuando hay intensidad, pero la persona conserva orientación y seguridad.</p>
                  <p>${efecto.manual_de_intervencion.no_intervencion_sosten}</p>
                </div>
              </div>

              <div class="bloque-icono">
                <div class="icono">⸱</div>
                <div>
                  <h4>Anclaje</h4>
                  <p class="micro-etiqueta">Cuando la experiencia empieza a desbordar o la persona pierde contacto con cuerpo y entorno.</p>
                  <p>${efecto.manual_de_intervencion.intervencion_minima_anclaje}</p>
                </div>
              </div>

              <div class="bloque-icono">
                <div class="icono">⟳</div>
                <div>
                  <h4>Reencuadre</h4>
                  <p class="micro-etiqueta">Cuando hace falta una intervención verbal breve para reducir amenaza o rigidez interpretativa.</p>
                  <p>${efecto.manual_de_intervencion.intervencion_activa_reencuadre}</p>
                </div>
              </div>

              <div class="bloque-icono">
                <div class="icono">▲</div>
                <div>
                  <h4>Escalamiento</h4>
                  <p>
                    ${efecto.criterios_de_escalamiento.criterio_observable_para_escalar}
                    <strong>Acción:</strong> ${efecto.criterios_de_escalamiento.accion_de_escalamiento}
                  </p>
                </div>
              </div>
            </div>

            <div class="ficha-integracion">
              <h3>Integración Post-Sesión</h3>

              <h4>Tema a explorar</h4>
              <p>${efecto.integracion_post_sesion.tema_a_explorar}</p>

              <h4>Práctica sugerida</h4>
              <p>${efecto.integracion_post_sesion.practica_sugerida}</p>
            </div>
            
          </div>
        </div>
      `;
    }
    
    function generarGlosario() {
      const itemsHtml = glosarioData.map(item => `
        <div class="glossary-item">
          <strong>${item.termino}</strong>
          ${item.definicion}
        </div>
      `).join('');
      
      return `
        <div class="pagina-a4 glossary-a4" id="glosario">
          <h1>Glosario de Términos</h1>
          ${itemsHtml}
        </div>
      `;
    }
    
    function generarChecklist() {
      return `
        <div class="pagina-a4 section-a4" id="checklist">
          <h1>Apéndice: Hoja de Uso en Sesión</h1>

          <h3>Antes de la sesión</h3>
          <ul>
            <li>Revisa el dominio de efectos más probable según dosis, sensibilidad, intención y contexto.</li>
            <li>Identifica vulnerabilidades conocidas: ansiedad basal, historia de pánico, disociación, trauma, rumiación o desregulación somática.</li>
            <li>Define de antemano cómo se aplicará el protocolo de sostén, anclaje, reencuadre y escalamiento.</li>
            <li>Verifica setting, música, iluminación, temperatura, acceso a agua y posibilidad de reducir estímulos.</li>
          </ul>

          <h3>Durante la sesión</h3>
          <ul>
            <li><strong>Observar:</strong> ¿la persona conserva orientación, respiración estable y seguridad física?</li>
            <li><strong>Sostener:</strong> si la experiencia es intensa pero estable, no interrumpas por ansiedad del facilitador.</li>
            <li><strong>Anclar:</strong> si hay desborde, confusión, pánico incipiente o pérdida de contacto corporal.</li>
            <li><strong>Reencuadrar:</strong> si aparece interpretación amenazante, rigidez narrativa o lucha contra la experiencia.</li>
            <li><strong>Escalar:</strong> si hay riesgo físico, agitación severa, ideación suicida, pérdida marcada de juicio de realidad o síntomas médicos relevantes.</li>
          </ul>

          <h3>Después de la sesión</h3>
          <ul>
            <li>Verifica estabilidad física y emocional antes del cierre.</li>
            <li>Registra efectos destacados, respuestas del facilitador y criterios usados.</li>
            <li>Programa seguimiento entre 24 y 72 horas cuando haya efectos intensos, confusos o de riesgo medio/alto.</li>
            <li>Usa la práctica de integración sugerida como punto de partida, no como interpretación obligatoria.</li>
            <li>Deriva si aparecen ansiedad persistente, confusión, insomnio grave, retraimiento, desrealización o creencias rígidas post-sesión.</li>
          </ul>
        </div>
      `;
    }

    function generarIndice() {
      if (!efectosData) return '';

      const itemsPorDominio = ordenDominios.map(dominio => {
        const slugDominio = slugify(dominio);
        const efectosDelDominio = efectosData.filter(e => e.dominio[0] === dominio);

        const efectosHtml = efectosDelDominio.map(e => {
          const id = 'efecto-' + slugify(e.efecto);
          return `<li><a href="#${id}">${e.efecto}</a></li>`;
        }).join('');

        const referenciasId = 'referencias-' + slugDominio;

        return `
          <li class="indice-dominio">
            <strong><a href="#dominio-${slugDominio}">Dominio: ${dominio}</a></strong>
            <ul>
              ${efectosHtml || '<li>Sin efectos listados</li>'}
              <li><a href="#${referenciasId}">Referencias del dominio</a></li>
            </ul>
          </li>
        `;
      }).join('');

      return `
        <div class="pagina-a4 indice-a4" id="indice">
          <h1>Índice / Tabla de contenidos</h1>
          <nav>
            <ul>
              ${itemsPorDominio}
              <li><a href="#glosario">Glosario</a></li>
              <li><a href="#checklist">Hoja de uso en sesión</a></li>
            </ul>
          </nav>
        </div>
      `;
    }

    // --- SECCIÓN 3: FUNCIÓN PRINCIPAL DE RENDERIZADO ---
    
    function renderizarAtlasCompleto() {
      const container = document.getElementById('atlas-container');

      if (!container || typeof efectosData === 'undefined') {
        console.error("Error: faltan datos de efectos o el contenedor HTML.");
        return;
      }
      
      let htmlCompleto = '';

      // 1. Portada
      htmlCompleto += `
        <div class="pagina-a4 portada-a4" id="portada">
          <h1>Atlas de Efectos Psicodélicos</h1>
          <h2>Qué puede aparecer en sesión y cómo responder</h2>
          <div class="autor">AUTOR: <strong>Dr. HOPE</strong></div>
        </div>
      `;

      // 2. Índice
      htmlCompleto += generarIndice();

      // 3. Introducción
      htmlCompleto += `
        <div class="pagina-a4 introduccion-a4" id="introduccion">
          <h1>Introducción: Afila la intuición</h1>
          ${textoIntroduccion}
        </div>
      `;
      
      // 4. Cómo usar
      htmlCompleto += generarSeccion(textoComoUsar, "Cómo usar este documento", "como-usar");
      
      // 5. Dominios, fichas y referencias
      for (const dominio of ordenDominios) {
        const dominioSlug = slugify(dominio);

        htmlCompleto += `
          <div class="pagina-a4 dominio-a4" id="dominio-${dominioSlug}">
            <h1 style="text-transform: capitalize;">Dominio: ${dominio}</h1>
            <p>${textosDominio[dominio]}</p>
          </div>
        `;

        const efectosDelDominio = efectosData.filter(efecto => efecto.dominio[0] === dominio);

        for (const efecto of efectosDelDominio) {
          htmlCompleto += generarHtmlFicha(efecto);
        }
        
        htmlCompleto += generarHtmlReferencias([dominio]);
      }
      
      // 6. Apéndices
      htmlCompleto += generarGlosario();
      htmlCompleto += generarChecklist();

      // 7. Cierre sobrio, sin CTA comercial
      htmlCompleto += `
        <div class="pagina-a4 section-a4" id="cierre">
          <h1>Cierre</h1>
          <p>Este atlas organiza efectos subjetivos para facilitar una lectura más clara durante la sesión. No busca explicar todos los mecanismos ni reemplazar criterio clínico.</p>

          <p>Úsalo para reconocer fenómenos, estimar riesgo, elegir el nivel de intervención y preparar una integración más concreta.</p>

          <span class="highlight">
            Lo subjetivo también puede leerse con orden: qué aparece, qué se observa, qué riesgo tiene y qué intervención corresponde.
          </span>

          <p style="margin-top: 30px; font-size: 0.95rem; color: #666;">
            <strong>Mountain.</strong> Material educativo para facilitadores y centros. No sustituye evaluación médica, psicológica ni supervisión clínica especializada.
          </p>
        </div>
      `;

      container.innerHTML = htmlCompleto;
    }

    document.addEventListener('DOMContentLoaded', renderizarAtlasCompleto);
  </script>

</body>
</html>

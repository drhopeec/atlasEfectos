<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas de Fenómenos Psicodélicos</title>
  
  <link rel="stylesheet" href="estilos.css">
  
  <script src="efectos.js"></script>
  <script src="referencias.js"></script>
</head>
<body>

  <main id="atlas-container"></main>

  <script>
    
    // --- SECCIÓN 1: DATOS Y TEXTOS NARRATIVOS ---

    const ordenDominios = ["visual", "cognitivo", "emocional", "autoprocesamiento", "somatico"];

    const textoIntroduccion = `
      <p>Este atlas está hecho para <strong>darle nombre a lo que aparece en sesión</strong> y acompañarlo con más criterio.</p>

      <p>Durante una experiencia psicodélica pueden aparecer fenómenos visuales, cognitivos, emocionales, somáticos y de autoprocesamiento. Algunos son intensos, pero esperables. Otros empiezan a comprometer orientación, regulación, juicio de realidad o seguridad.</p>

      <p>La tarea del facilitador no es interpretar de inmediato ni intervenir por ansiedad propia. Primero se lee el fenómeno, se sostiene el campo y se observa si la persona puede atravesarlo con estabilidad.</p>

      <p>Este atlas usa la presencia <strong>CUSHION</strong> como base operativa: calma, ubicación, seguridad, hospitalidad, interés, orientación y no imposición.</p>

      <span class="highlight">No todo fenómeno intenso requiere intervención. Primero se lee, se sostiene y se observa.</span>
    `;

    const textoComoUsar = `
      <p>Este documento está diseñado para consulta rápida, estudio y supervisión. No necesita leerse de corrido. Puedes entrar por dominio o ir directamente a la ficha del fenómeno.</p>

      <p>Cada <strong>fenómeno</strong> se presenta en seis bloques:</p>

      <ul>
        <li><strong>Fenomenología:</strong> lo que la persona puede reportar y lo que el facilitador puede observar.</li>
        <li><strong>Mecanismo probable:</strong> una explicación breve en lenguaje simple. No desarrolla teoría neurobiológica extensa.</li>
        <li><strong>Lectura operativa:</strong> cómo entender el fenómeno en sesión y qué observar antes de intervenir.</li>
        <li><strong>Presencia CUSHION:</strong> qué cualidad de presencia conviene priorizar.</li>
        <li><strong>Frases útiles:</strong> lenguaje breve, neutral y no sugestivo.</li>
        <li><strong>Señales para intervención directiva:</strong> cuándo ya no basta con sostener y hace falta anclar, reencuadrar o escalar.</li>
      </ul>

      <p><strong>Uso recomendado:</strong> primero observa. Si la persona conserva orientación, respiración suficiente, contacto y seguridad física, sostén con CUSHION. Si aparece desborde, pérdida de contacto, pánico, riesgo físico o rigidez interpretativa, pasa a una intervención más directiva.</p>

      <p>La regla base es esta: <strong>un fenómeno subjetivo no se evalúa por lo extraño que parece, sino por su impacto en orientación, regulación, juicio de realidad y seguridad.</strong></p>
    `;

    const textoCushion = `
      <p><strong>CUSHION</strong> es una técnica de presencia para acompañar antes de intervenir. No significa quedarse pasivo. Significa regular el campo sin imponer dirección.</p>

      <ul>
        <li><strong>C — Calma:</strong> regula primero tu respiración, tono y postura. Tu ansiedad puede contagiar la sala.</li>
        <li><strong>U — Ubicación:</strong> mantente disponible, estable y predecible. No deambules ni invadas.</li>
        <li><strong>S — Seguridad:</strong> recuerda que está acompañado y que el espacio está contenido.</li>
        <li><strong>H — Hospitalidad:</strong> permite que aparezca material difícil sin mostrar juicio, miedo o rechazo.</li>
        <li><strong>I — Interés:</strong> escucha sin interrogar ni dirigir por curiosidad.</li>
        <li><strong>O — Orientación:</strong> si la persona pierde referencias, vuelve a lo concreto: cuerpo, espacio, voz, respiración.</li>
        <li><strong>N — No imposición:</strong> no expliques visiones, no sugieras significados y no refuerces conclusiones rígidas.</li>
      </ul>

      <span class="highlight">Presencia CUSHION es la base. La intervención directiva viene después, solo si la estabilidad empieza a fallar.</span>
    `;

    const textosDominio = {
      "visual": "Lo que la persona <strong>ve</strong>. Desde geometrías hasta figuras, estelas o superficies que parecen moverse. La tarea no es interpretar la imagen, sino observar si hay curiosidad, miedo, desorientación o pérdida de seguridad.",
      "cognitivo": "Lo que la persona <strong>piensa</strong>. Ideas rápidas, bucles, intuiciones súbitas o cambios en la percepción del tiempo. El punto no es debatir el contenido, sino leer coherencia, flexibilidad, contacto y juicio de realidad.",
      "emocional": "Lo que la persona <strong>siente</strong>. Miedo, culpa, tristeza, dicha, alivio o catarsis. La intensidad emocional no es un problema por sí misma; el problema aparece cuando rebasa la capacidad de regulación.",
      "autoprocesamiento": "Lo que la persona <strong>revisa sobre sí misma</strong>. Identidad, autocrítica, aceptación, memoria autobiográfica o sentido personal. Aquí se acompaña sin imponer significado ni convertir una experiencia aguda en verdad definitiva.",
      "somatico": "Lo que la persona <strong>manifiesta en el cuerpo</strong>. Náuseas, calor, temblores, presión, palpitaciones o cambios respiratorios. Aquí se diferencia entre descarga esperable, ansiedad somática y señal médica relevante."
    };

    const glosarioData = [
      {
        "termino": "Presencia CUSHION",
        "definicion": "Técnica de acompañamiento basada en calma, ubicación, seguridad, hospitalidad, interés, orientación y no imposición. Es la base antes de intervenir de forma directiva."
      },
      {
        "termino": "Calma",
        "definicion": "Capacidad del facilitador para regular su propio tono, respiración, postura y velocidad antes de intentar regular al participante."
      },
      {
        "termino": "Ubicación",
        "definicion": "Presencia física estable, visible y predecible. Ayuda a que la persona sepa dónde está el facilitador sin sentirse invadida."
      },
      {
        "termino": "Seguridad",
        "definicion": "Recordatorio verbal, corporal y contextual de que la persona está acompañada y el espacio está contenido."
      },
      {
        "termino": "Hospitalidad",
        "definicion": "Actitud de apertura ante material difícil, extraño o emocionalmente cargado, sin juicio ni rechazo."
      },
      {
        "termino": "Interés",
        "definicion": "Escucha atenta sin interrogatorio. El facilitador acompaña la experiencia sin dirigirla por curiosidad propia."
      },
      {
        "termino": "Orientación",
        "definicion": "Uso de referencias simples para volver al cuerpo, la sala, la voz, la respiración o el presente cuando la persona pierde contacto."
      },
      {
        "termino": "No imposición",
        "definicion": "Principio de no sugerir significados, no interpretar visiones y no reforzar conclusiones rígidas durante un estado de alta sugestionabilidad."
      },
      {
        "termino": "Anclaje",
        "definicion": "Intervención mínima para reconectar a la persona con el cuerpo o el entorno mediante respiración, contacto con superficies, voz o referencias concretas."
      },
      {
        "termino": "Reencuadre",
        "definicion": "Intervención verbal breve para reducir amenaza o rigidez interpretativa sin imponer significado."
      },
      {
        "termino": "Escalamiento",
        "definicion": "Paso a protocolo de seguridad, apoyo clínico o derivación cuando hay riesgo físico, agitación severa, paranoia refractaria, ideación suicida o pérdida marcada del juicio de realidad."
      },
      {
        "termino": "Fenomenología",
        "definicion": "Descripción de lo que la persona vive subjetivamente y de lo que el facilitador puede observar desde fuera."
      },
      {
        "termino": "Mecanismo probable",
        "definicion": "Explicación breve del fenómeno usando lenguaje simple de percepción, interocepción, significado, memoria, emoción, orientación o regulación."
      },
      {
        "termino": "Lectura operativa",
        "definicion": "Interpretación práctica de lo que está ocurriendo en sesión para decidir si sostener, anclar, reencuadrar o escalar."
      },
      {
        "termino": "Shock ontológico",
        "definicion": "Desorganización o confusión cuando la experiencia desafía intensamente las creencias básicas sobre realidad, identidad o sentido."
      },
      {
        "termino": "Cualidad noética",
        "definicion": "Sensación subjetiva de certeza profunda. Puede generar insight, pero también conclusiones rígidas si se toma como verdad literal sin revisión."
      }
    ];

    // --- SECCIÓN 2: FUNCIONES DE AYUDA ---

    function slugify(text) {
      return text.toString().toLowerCase().trim()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-');
    }

    function mapearLista(items) {
      if (!items || items.length === 0) return '<p>NA</p>';
      const itemsFiltrados = items.filter(item => item && item !== "NA");
      if (itemsFiltrados.length === 0) return '<p>NA</p>';
      return `<ul>${itemsFiltrados.map(item => `<li>${item}</li>`).join('')}</ul>`;
    }

    function obtenerDominioPrincipal(efecto) {
      return efecto.dominio && efecto.dominio.length ? efecto.dominio[0] : "general";
    }

    function obtenerMecanismoProbable(efecto) {
      if (efecto.mecanismo_probable) return efecto.mecanismo_probable;
      if (efecto.lectura_operativa && efecto.lectura_operativa.mecanismo_probable) return efecto.lectura_operativa.mecanismo_probable;
      if (efecto.neurobiologia_aplicada && efecto.neurobiologia_aplicada.mecanismo_hipotetico) {
        return simplificarMecanismo(efecto.neurobiologia_aplicada.mecanismo_hipotetico, obtenerDominioPrincipal(efecto));
      }
      return mecanismoGenericoPorDominio(obtenerDominioPrincipal(efecto));
    }

    function simplificarMecanismo(texto, dominio) {
      const mecanismoPorDominio = {
        "visual": "Puede aparecer cuando la percepción visual recibe más información interna o ambigua de lo habitual. La imagen se vuelve menos estable y más flexible.",
        "cognitivo": "Puede aparecer cuando los patrones habituales de pensamiento pierden rigidez y surgen asociaciones, dudas o ideas con mayor intensidad.",
        "emocional": "Puede aparecer cuando una emoción gana intensidad y se vuelve difícil de evitar. El sistema afectivo está más abierto y sensible.",
        "autoprocesamiento": "Puede aparecer cuando la narrativa habitual del yo se vuelve más flexible. La persona puede verse desde una perspectiva menos fija.",
        "somatico": "Puede aparecer cuando la atención hacia el cuerpo aumenta. Sensaciones internas habituales pueden sentirse más intensas o extrañas."
      };

      return mecanismoPorDominio[dominio] || texto;
    }

    function mecanismoGenericoPorDominio(dominio) {
      const mecanismo = {
        "visual": "La percepción visual puede volverse más flexible. Formas, colores, movimiento o patrones pueden sentirse más intensos o menos estables.",
        "cognitivo": "El pensamiento puede volverse más asociativo, menos lineal o más cargado de significado.",
        "emocional": "La emoción puede intensificarse y hacerse más visible. Lo evitado puede aparecer con más fuerza.",
        "autoprocesamiento": "La relación con el yo, la identidad o la historia personal puede sentirse menos fija.",
        "somatico": "Las señales internas del cuerpo pueden sentirse más presentes, intensas o difíciles de ignorar."
      };

      return mecanismo[dominio] || "El fenómeno puede reflejar un cambio temporal en percepción, emoción, cuerpo, memoria o significado.";
    }

    function obtenerLecturaOperativa(efecto) {
      if (efecto.lectura_operativa && efecto.lectura_operativa.lectura) return efecto.lectura_operativa.lectura;
      if (efecto.lectura_operativa && typeof efecto.lectura_operativa === "string") return efecto.lectura_operativa;

      const dominio = obtenerDominioPrincipal(efecto);

      const lecturas = {
        "visual": "Si la persona observa con curiosidad y conserva contacto, no interrumpas. Si aparece miedo, desorientación o intento de abandonar el espacio, pasa a orientación y anclaje.",
        "cognitivo": "Si el pensamiento fluye sin angustia ni rigidez, sostén. Si aparecen bucles, paranoia o certeza rígida, reduce estímulos y ofrece orientación breve.",
        "emocional": "Si la emoción se mueve y la persona conserva seguridad, acompaña sin cortar. Si hay pánico sostenido, evitación extrema o riesgo físico, ancla y escala si no responde.",
        "autoprocesamiento": "Si la revisión del yo ocurre con apertura y estabilidad, no impongas significado. Si aparece fragmentación, grandiosidad o terror, orienta al cuerpo y al presente.",
        "somatico": "Si la sensación corporal cambia y la persona puede respirar, sostén. Si hay signos médicos relevantes, pánico somático o agitación peligrosa, evalúa y escala."
      };

      return lecturas[dominio] || "Observa orientación, regulación, contacto interpersonal, juicio de realidad y seguridad antes de intervenir.";
    }

    function obtenerCushion(efecto) {
      if (efecto.presencia_cushion) return efecto.presencia_cushion;

      const dominio = obtenerDominioPrincipal(efecto);

      const cushionPorDominio = {
        "visual": {
          "prioridad": "Ubicación + No imposición",
          "hacer": "Mantente estable, visible si hace falta, y evita interpretar las imágenes. Permite que el fenómeno visual ocurra si no hay miedo ni desorientación.",
          "evitar": "No digas qué significa la imagen. No conviertas una visión en mensaje, símbolo o diagnóstico."
        },
        "cognitivo": {
          "prioridad": "No imposición + Orientación",
          "hacer": "Escucha sin debatir el contenido. Si hay confusión, vuelve a lo concreto: cuerpo, sala, respiración y temporalidad.",
          "evitar": "No refuerces certezas rígidas. No discutas ideas complejas durante el pico."
        },
        "emocional": {
          "prioridad": "Seguridad + Hospitalidad",
          "hacer": "Permite que la emoción exista sin intentar arreglarla. Refuerza que está acompañado y que no necesita resolverla ahora.",
          "evitar": "No cortes el llanto por incomodidad. No digas que no pasa nada."
        },
        "autoprocesamiento": {
          "prioridad": "Hospitalidad + No imposición",
          "hacer": "Recibe lo que aparece sobre identidad, culpa o sentido personal sin convertirlo en verdad final.",
          "evitar": "No confirmes narrativas absolutas sobre quién es la persona o qué significa su vida."
        },
        "somatico": {
          "prioridad": "Calma + Orientación",
          "hacer": "Baja tu ritmo, observa respiración y seguridad física. Orienta al cuerpo sin dramatizar la sensación.",
          "evitar": "No espiritualices síntomas físicos. No ignores señales médicas relevantes."
        }
      };

      return cushionPorDominio[dominio] || {
        "prioridad": "Calma + Seguridad",
        "hacer": "Mantén presencia estable, voz baja y observación clara.",
        "evitar": "No interpretes ni dirijas sin necesidad."
      };
    }

    function obtenerFrasesUtiles(efecto) {
      if (efecto.frases_utiles) return efecto.frases_utiles;

      const manual = efecto.manual_de_intervencion || {};
      const normalizacion =
        efecto.lectura_operativa?.frase_de_normalizacion ||
        efecto.neurobiologia_aplicada?.frase_de_normalizacion ||
        "Estoy aquí contigo. No necesitas resolver esto ahora.";

      return {
        "sosten": manual.no_intervencion_sosten || normalizacion,
        "anclaje": manual.intervencion_minima_anclaje || "Vuelve al cuerpo. Siente el contacto con la superficie y escucha mi voz.",
        "orientacion": manual.intervencion_activa_reencuadre || "Esto es temporal. Estás en la sesión, estás acompañado y podemos volver a lo concreto."
      };
    }

    function obtenerSenalesDirectivas(efecto) {
      if (efecto.senales_intervencion_directiva) return efecto.senales_intervencion_directiva;

      const criterios = efecto.criterios_de_escalamiento || {};
      const principal = criterios.criterio_observable_para_escalar || "Pérdida de orientación, pánico sostenido, riesgo físico o incapacidad de responder a la voz.";

      return [
        principal,
        "Pérdida marcada de contacto con el entorno o con el facilitador.",
        "Riesgo físico, intento de levantarse sin estabilidad o agitación peligrosa.",
        "Interpretación amenazante rígida, paranoia o imposibilidad de cuestionar el contenido.",
        "Síntomas médicos relevantes o signos vitales fuera de rango."
      ];
    }

    function obtenerAccionDirectiva(efecto) {
      if (efecto.accion_directiva) return efecto.accion_directiva;
      if (efecto.criterios_de_escalamiento && efecto.criterios_de_escalamiento.accion_de_escalamiento) {
        return efecto.criterios_de_escalamiento.accion_de_escalamiento;
      }
      return "Pasar de presencia a anclaje, orientación verbal breve y protocolo de seguridad si no hay respuesta.";
    }

    function generarSeccion(texto, titulo, id = '') {
      const idAttr = id ? ` id="${id}"` : '';
      return `
        <div class="pagina-a4 section-a4"${idAttr}>
          <h1>${titulo}</h1>
          ${texto}
        </div>
      `;
    }

    function generarHtmlReferencias(dominios = []) {
      if (typeof referenciasData === 'undefined') return ''; 

      const referenciasUnicas = new Set();
      
      for (const dominio of dominios) {
        if (referenciasData[dominio]) {
          referenciasData[dominio].forEach(ref => {
            referenciasUnicas.add(JSON.stringify(ref));
          });
        }
      }

      const referencias = Array.from(referenciasUnicas).map(refStr => JSON.parse(refStr));
      if (referencias.length === 0) return ''; 

      const listaHtml = referencias.map(ref => `
        <li>
          <strong>${ref.referencia}</strong>
          ${ref.resumen_atlas ? ref.resumen_atlas : ''}
        </li>
      `).join('');

      const dominioId = 'referencias-' + slugify(dominios[0]);

      return `
        <div class="pagina-a4 referencias-pagina" id="${dominioId}">
          <h1 style="text-transform: capitalize;">Referencias: Dominio ${dominios[0]}</h1>
          <ul class="lista-referencias">
            ${listaHtml}
          </ul>
        </div>
      `;
    }

    function generarHtmlFicha(efecto) {
  const fichaId = 'efecto-' + slugify(efecto.efecto);
  const mecanismoProbable = obtenerMecanismoProbable(efecto);
  const lecturaOperativa = obtenerLecturaOperativa(efecto);
  const cushion = obtenerCushion(efecto);
  const frases = obtenerFrasesUtiles(efecto);
  const senales = obtenerSenalesDirectivas(efecto);
  const accionDirectiva = obtenerAccionDirectiva(efecto);

  return `
    <div class="pagina-a4 ficha-a4" id="${fichaId}">
      <header class="ficha-header">
        <h1>${efecto.efecto}</h1>
        <h2>${efecto.dominio.join(' / ')}</h2>
      </header>
      
      <div class="ficha-grid">
        
        <div class="grid-col">
          <h3>Fenomenología</h3>

          <h4>Reporte subjetivo</h4>
          <p>${efecto.fenomenologia.descripcion_paciente}</p>

          <h4>Signos observables</h4>
          <p>${efecto.fenomenologia.signos_observables}</p>
        </div>
        
        <div class="grid-col">
          <h3>Mecanismo probable</h3>

          <p>${mecanismoProbable}</p>

          <h4>Lectura operativa</h4>
          <p>${lecturaOperativa}</p>
        </div>
        
        <div class="grid-col">
          <h3>Presencia CUSHION</h3>

          <div class="matriz-riesgo-box cushion-box">
            <h4 class="riesgo-titulo">Prioridad: <span>${cushion.prioridad}</span></h4>
            <p>${cushion.hacer}</p>
          </div>

          <h4>Evita</h4>
          <p>${cushion.evitar}</p>
        </div>
        
        <div class="ficha-manual">
          <h3>Frases útiles</h3>

          <div class="bloque-icono">
            <div class="icono">✦</div>
            <div>
              <h4>Sostén</h4>
              <p class="micro-etiqueta">Cuando hay intensidad, pero la persona conserva orientación, contacto y seguridad.</p>
              <p>${frases.sosten}</p>
            </div>
          </div>

          <div class="bloque-icono">
            <div class="icono">⸱</div>
            <div>
              <h4>Anclaje</h4>
              <p class="micro-etiqueta">Cuando la experiencia empieza a desbordar o la persona pierde contacto con cuerpo y entorno.</p>
              <p>${frases.anclaje}</p>
            </div>
          </div>

          <div class="bloque-icono">
            <div class="icono">⟳</div>
            <div>
              <h4>Orientación / reencuadre breve</h4>
              <p class="micro-etiqueta">Cuando aparece amenaza, confusión o rigidez interpretativa.</p>
              <p>${frases.orientacion}</p>
            </div>
          </div>
        </div>

        <div class="ficha-integracion">
          <h3>Señales para intervención directiva</h3>

          ${mapearLista(senales)}

          <h4>Acción sugerida</h4>
          <p>${accionDirectiva}</p>
        </div>
        
      </div>
    </div>
  `;
}
    
    function generarGlosario() {
      const itemsHtml = glosarioData.map(item => `
        <div class="glossary-item">
          <strong>${item.termino}</strong>
          ${item.definicion}
        </div>
      `).join('');
      
      return `
        <div class="pagina-a4 glossary-a4" id="glosario">
          <h1>Glosario de Términos</h1>
          ${itemsHtml}
        </div>
      `;
    }
    
    function generarChecklist() {
      return `
        <div class="pagina-a4 section-a4" id="checklist">
          <h1>Apéndice: Hoja de Uso en Sesión</h1>

          <h3>Antes de la sesión</h3>
          <ul>
            <li>Pacta señales simples antes de la dosis: pulgar arriba, levantar la mano o una palabra breve.</li>
            <li>Define qué hará el facilitador si la persona parece dormida, inmóvil, desbordada o desorientada.</li>
            <li>Revisa setting, música, iluminación, temperatura, acceso a agua y posibilidad de reducir estímulos.</li>
            <li>Recuerda el principio base: primero CUSHION, después intervención directiva si hace falta.</li>
          </ul>

          <h3>Durante la sesión</h3>
          <ul>
            <li><strong>Calma:</strong> regula tu voz, respiración, postura y velocidad.</li>
            <li><strong>Ubicación:</strong> permanece disponible, estable y predecible.</li>
            <li><strong>Seguridad:</strong> recuerda el encuadre sin saturar de palabras.</li>
            <li><strong>Hospitalidad:</strong> permite que aparezca material difícil sin mostrar rechazo.</li>
            <li><strong>Interés:</strong> escucha sin interrogar ni dirigir.</li>
            <li><strong>Orientación:</strong> vuelve a cuerpo, sala, respiración y presente si se pierde contacto.</li>
            <li><strong>No imposición:</strong> no expliques visiones ni refuerces certezas rígidas.</li>
          </ul>

          <h3>Cuándo pasar de CUSHION a intervención directiva</h3>
          <ul>
            <li>La persona no responde a la voz o pierde contacto de forma marcada.</li>
            <li>Hay pánico sostenido, agitación psicomotriz o riesgo físico.</li>
            <li>Intenta abandonar el espacio sin orientación o equilibrio.</li>
            <li>Aparece paranoia hacia el facilitador o el entorno.</li>
            <li>Hay síntomas médicos relevantes o signos vitales fuera de rango.</li>
            <li>Aparece ideación suicida, conducta autolesiva o amenaza hacia otros.</li>
          </ul>
        </div>
      `;
    }

    function generarIndice() {
      if (!efectosData) return '';

      const itemsPorDominio = ordenDominios.map(dominio => {
        const slugDominio = slugify(dominio);
        const efectosDelDominio = efectosData.filter(e => e.dominio[0] === dominio);

        const efectosHtml = efectosDelDominio.map(e => {
          const id = 'efecto-' + slugify(e.efecto);
          return `<li><a href="#${id}">${e.efecto}</a></li>`;
        }).join('');

        const referenciasId = 'referencias-' + slugDominio;

        return `
          <li class="indice-dominio">
            <strong><a href="#dominio-${slugDominio}">Dominio: ${dominio}</a></strong>
            <ul>
              ${efectosHtml || '<li>Sin efectos listados</li>'}
              <li><a href="#${referenciasId}">Referencias del dominio</a></li>
            </ul>
          </li>
        `;
      }).join('');

      return `
        <div class="pagina-a4 indice-a4" id="indice">
          <h1>Índice / Tabla de contenidos</h1>
          <nav>
            <ul>
              ${itemsPorDominio}
              <li><a href="#cushion">Presencia CUSHION</a></li>
              <li><a href="#glosario">Glosario</a></li>
              <li><a href="#checklist">Hoja de uso en sesión</a></li>
            </ul>
          </nav>
        </div>
      `;
    }

    // --- SECCIÓN 3: FUNCIÓN PRINCIPAL DE RENDERIZADO ---
    
    function renderizarAtlasCompleto() {
      const container = document.getElementById('atlas-container');

      if (!container || typeof efectosData === 'undefined') {
        console.error("Error: faltan datos de efectos o el contenedor HTML.");
        return;
      }
      
      let htmlCompleto = '';

      // 1. Portada
      htmlCompleto += `
        <div class="pagina-a4 portada-a4" id="portada">
          <h1>Atlas de Fenómenos Psicodélicos</h1>
          <h2>Lectura operativa y presencia CUSHION en sesión</h2>
          <div class="autor">AUTOR: <strong>Dr. HOPE</strong></div>
        </div>
      `;

      // 2. Índice
      htmlCompleto += generarIndice();

      // 3. Introducción
      htmlCompleto += `
        <div class="pagina-a4 introduccion-a4" id="introduccion">
          <h1>Introducción: Primero lee, luego intervén</h1>
          ${textoIntroduccion}
        </div>
      `;
      
      // 4. Cómo usar
      htmlCompleto += generarSeccion(textoComoUsar, "Cómo usar este documento", "como-usar");

      // 5. Presencia CUSHION
      htmlCompleto += generarSeccion(textoCushion, "Presencia CUSHION", "cushion");
      
      // 6. Dominios, fichas y referencias
      for (const dominio of ordenDominios) {
        const dominioSlug = slugify(dominio);

        htmlCompleto += `
          <div class="pagina-a4 dominio-a4" id="dominio-${dominioSlug}">
            <h1 style="text-transform: capitalize;">Dominio: ${dominio}</h1>
            <p>${textosDominio[dominio]}</p>
          </div>
        `;

        const efectosDelDominio = efectosData.filter(efecto => efecto.dominio[0] === dominio);

        for (const efecto of efectosDelDominio) {
          htmlCompleto += generarHtmlFicha(efecto);
        }
        
        htmlCompleto += generarHtmlReferencias([dominio]);
      }
      
      // 7. Apéndices
      htmlCompleto += generarGlosario();
      htmlCompleto += generarChecklist();

      // 8. Cierre
      htmlCompleto += `
        <div class="pagina-a4 section-a4" id="cierre">
          <h1>Cierre</h1>

          <p>Este atlas organiza fenómenos subjetivos para facilitar una lectura más clara durante la sesión. No busca explicar toda la neurobiología ni reemplazar criterio clínico.</p>

          <p>Úsalo para reconocer qué aparece, observar si la persona conserva orientación y decidir si basta con presencia CUSHION o si hace falta una intervención más directiva.</p>

          <span class="highlight">
            No todo fenómeno intenso requiere intervención. Primero se lee, se sostiene y se observa.
          </span>

          <p style="margin-top: 30px; font-size: 0.95rem; color: #666;">
            <strong>Mountain.</strong> Material educativo para facilitadores y centros. No sustituye evaluación médica, psicológica ni supervisión clínica especializada.
          </p>
        </div>
      `;

      container.innerHTML = htmlCompleto;
    }

    document.addEventListener('DOMContentLoaded', renderizarAtlasCompleto);
  </script>

</body>
</html>
